services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=assetflow
      - SECRET_KEY=dev-secret-change-in-production
      - CORS_ORIGINS=http://localhost:5173
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongodb_data:
